name: Deploy to S3

on:
  push:
    branches: [bot]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  BUCKET: beta2.seqmash.com
  DISTRIBUTION: E29ZE1LEEEILX7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rewrite paths for /bot2 deployment
        run: |
          find . -type f \( -name "*.html" -o -name "*.js" \) ! -path "./.git/*" ! -path "./.github/*" ! -path "./lambdas/*" ! -path "./maintenance/*" ! -path "./.intent/*" -exec sed -i "s|'/data'|'/bot2/data'|g; s|'/apc'|'/bot2/apc'|g" {} \;

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://$BUCKET/bot2" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "lambdas/*" \
            --exclude "maintenance/*" \
            --exclude ".intent/*" \
            --exclude "tasks" \
            --exclude ".gitignore"

      - name: Invalidate CloudFront /bot2 paths
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/bot2/*"
