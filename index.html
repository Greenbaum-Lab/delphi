<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>DELPHI</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>
<svg aria-hidden="true" style="display:none">
	<symbol id="icon-sort" viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h6"/></symbol>
	<symbol id="icon-measure" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h3M17 12h3M12 4v3M12 17v3"/></symbol>
	<symbol id="icon-populations" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><circle cx="17" cy="9" r="2.2"/><path d="M15.8 13.3c2.4.5 4.2 2.3 4.2 4.7"/></symbol>
	<symbol id="icon-annotations" viewBox="0 0 24 24"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.82Z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></symbol>
	<symbol id="icon-more" viewBox="0 0 24 24"><rect x="4" y="10" width="4" height="10"/><rect x="10" y="5" width="4" height="15"/><rect x="16" y="13" width="4" height="7"/></symbol>
	<symbol id="icon-guides" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16" stroke-dasharray="2.5 2.5"/></symbol>
	<symbol id="icon-export" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></symbol>
	<symbol id="icon-reset" viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h9a7 7 0 0 1 0 14H8"/></symbol>
</svg>
<div class="wrap genome-browser" data-module="browser">
	<header class="top-bar">
		<div class="top-bar-left">
			<div class="logo" data-icon="0">DELPHI</div><div class="mode"></div>
			<input type="text" class="region-query" data-input="region" placeholder="chr1:1000000-2000000" value="chr1:1000000-2000000">
			<a data-icon="S" data-action="search-annotation" data-tooltip="Go to region or search gene" aria-label="Go to region or search gene"></a>
		</div>
		<div class="view-finder-container">
			<div class="view-finder" data-module="track" data-type="viewfinder" data-source="gencode19_genes" aria-label="View finder"></div>
		</div>
	</header>
	<main class="viewport">
		<div class="tracks-container annotation-tracks-container">
		</div>
		<div class="tracks-controls">
			<div class="control-group sort-container">
				<a data-icon="O" data-action="toggle-sort" class="icon-btn" data-tooltip="Sort direction" aria-label="Sort direction"></a>
				<svg class="group-icon" aria-hidden="true"><use href="#icon-sort"></use></svg>
				<span class="tooltip-wrap" data-tooltip="Order tracks by metadata">
					<select data-control="sort" class="sort-selector">
						<option value="time">Time</option>
						<option value="Distance_from_Africa">Distance from Africa</option>
						<option value="Latitude">Latitude</option>
						<option value="Longitude">Longitude</option>
						<option value="Temperature_index">Temperature</option>
						<option value="Precipitation_index">Precipitation</option>
						<option value="Agriculture_extensiveness">Neolithic onset</option>
						<option value="Urbanization_onset">Urbanization onset</option>
						<option value="signal">Signal</option>
					</select>
					<select data-control="sort" class="sort-selector-pairwise">
						<option value="time">Temporal distance</option>
						<option value="Distance_from_Africa">Waypoint distance</option>
						<option value="genetic_distance">Genetic distance</option>
						<option value="Temperature_index">Temperature</option>
						<option value="Precipitation_index">Precipitation</option>
						<option value="signal">Signal</option>
					</select>
				</span>
			</div>

			<div class="control-group">
				<svg class="group-icon" aria-hidden="true"><use href="#icon-measure"></use></svg>
				<span class="tooltip-wrap" data-tooltip="Select population genetics statistics">
					<select data-control="measure" class="measure-selector">
						<option value="heterozygosity" selected>Heterozygosity</option>
						<option value="fst">FST</option>
						<option value="tajimasd">Tajima's D</option>
						<option value="fulif">Fu &amp; Li's F</option>
					</select>
				</span>
			</div>

			<div class="control-group control-group-populations" data-module="library">
				<a class="icon-btn icon-btn-populations" data-action="open-populations" data-tooltip="Select populations" aria-label="Select populations">
					<svg aria-hidden="true"><use href="#icon-populations"></use></svg>
				</a>
			</div>

			<div class="control-group control-group-annotations">
				<a class="icon-btn icon-btn-annotations" data-action="open-annotations" data-tooltip="Add annotations" aria-label="Add annotations">
					<svg aria-hidden="true"><use href="#icon-annotations"></use></svg>
				</a>
			</div>

			<div class="controls-spacer"></div>

			<div class="more-menu">
				<a class="icon-btn more-toggle" data-action="toggle-more-menu" data-tooltip="More display options" aria-label="More display options" aria-haspopup="true" aria-expanded="false">
					<svg aria-hidden="true"><use href="#icon-more"></use></svg>
				</a>
				<div class="more-panel" data-more-panel hidden>
					<div class="more-row">
						<label class="more-label">Window size</label>
						<span class="tooltip-wrap" data-tooltip="Genomic window size for aggregating signal">
							<select data-control="window" class="window-selector">
								<option value="10000">10 kb</option>
								<option value="100000">100 kb</option>
								<option value="1000000">1 Mb</option>
							</select>
						</span>
					</div>
					<div class="more-row">
						<span class="more-label">Display style</span>
						<a data-action="display" data-icon="a" class="icon-btn" data-tooltip="Cycle bar / line / scatter display" aria-label="Cycle display style"></a>
					</div>
					<div class="more-divider"></div>
					<div class="more-row y-axis-control">
						<span class="more-label">Y-axis</span>
						<span class="tooltip-wrap" data-tooltip="Y-axis minimum (leave blank to auto-fit)">
							<input type="number" step="any" data-control="ymin" class="y-limit" placeholder="min" aria-label="Y-axis minimum">
						</span>
						<span class="tooltip-wrap" data-tooltip="Y-axis maximum (leave blank to auto-fit)">
							<input type="number" step="any" data-control="ymax" class="y-limit" placeholder="max" aria-label="Y-axis maximum">
						</span>
					</div>
					<div class="more-row">
						<span class="more-label">Guides</span>
						<a data-action="toggle-guides" class="icon-btn" data-tooltip="Show vertical guide lines across tracks" aria-label="Toggle guides">
							<svg aria-hidden="true"><use href="#icon-guides"></use></svg>
						</a>
					</div>
					<div class="more-row">
						<span class="more-label">Track size</span>
						<a data-icon="m" data-action="decrease-track-size" class="icon-btn" data-tooltip="Decrease track size" aria-label="Decrease track size"></a>
						<a data-icon="+" data-action="increase-track-size" class="icon-btn" data-tooltip="Increase track size" aria-label="Increase track size"></a>
					</div>
					<div class="more-divider"></div>
					<div class="more-row">
						<span class="more-label">Export data</span>
						<a class="icon-btn icon-btn-placeholder" aria-disabled="true" data-tooltip="Export as CSV (coming soon)" aria-label="Export as CSV (coming soon)">
							<svg aria-hidden="true"><use href="#icon-export"></use></svg>
						</a>
					</div>
					<div class="more-divider"></div>
					<div class="more-row">
						<span class="more-label">Reset</span>
						<a data-action="reset-defaults" class="icon-btn" data-tooltip="Reset all controls to defaults" aria-label="Reset all controls to defaults">
							<svg aria-hidden="true"><use href="#icon-reset"></use></svg>
						</a>
					</div>
				</div>
			</div>

			<div class="controls-spacer controls-spacer-fixed"></div>
		</div>
		<div class="tracks-container signal-tracks-container">
			<div class="empty-state" data-action="open-populations">Select populations to display data</div>
		</div>
		<template id="signal-track-template">
			<div class="track-left-margin">
				<div class="track-move"></div>
				<div class="track-buttons">
					<a data-action="individuals" data-icon="I" data-tooltip="Show individuals in data" aria-label="Show individuals in data"></a>
					<a data-action="pin" data-icon="p" data-tooltip="Pin track (always show above data tracks)" aria-label="Pin track"></a>
					<a data-action="remove" data-icon="x" data-tooltip="Remove track from display" aria-label="Remove track from display"></a>
				</div>
				<div class="track-metadata"><div class="track-label"></div><div class="track-type"></div><div class="track-value"></div></div>
			</div>
			<div class="track-plot-area"></div>
			<div class="track-tooltip"></div>
			<div class="track-loading">Loading data...</div>
		</template>
		<template id="annotation-track-template">
			<div class="track-left-margin">
				<div class="track-move"></div>
				<div class="track-buttons">
					<a data-action="annotation-display" data-icon="s" data-tooltip="Toggle annotation display style" aria-label="Toggle annotation display style"></a>
					<a data-action="search-annotation" data-icon="S" data-tooltip="Search in annotation" aria-label="Search in annotation"></a>
					<a data-action="remove" data-icon="x" data-tooltip="Remove annotation from display" aria-label="Remove annotation from display"></a>
				</div>
				<div class="track-metadata">
					<div class="track-label"></div>
					<div class="track-type"></div>
					<div class="track-value"></div>
				</div>
			</div>
			<div class="track-plot-area"></div>
			<div class="track-tooltip"></div>
		</template>
	</main>
	<!-- Footer -->
	<footer class="footer">
		<span>DELPHI</span> | <a href="/tutorial.html" target="_blank">Tutorial</a> | <a href="/COPYING.txt" target="_blank">License</a>
	</footer>
</div>
<div class="loading-overlay">Loading...</div>
<script type="module" src="/init.js"></script>
</body>
</html>
